<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">IIPMS Logo</title>
  <desc id="desc">Shield and pulse waves representing invisible pollution monitoring.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)"/>
  <path d="M64 24 L95 38 V62 C95 84 80 99 64 106 C48 99 33 84 33 62 V38 Z"
        fill="none" stroke="#93c5fd" stroke-width="6" stroke-linejoin="round"/>
  <path d="M33 67 H49 L57 52 L67 80 L75 61 H95"
        fill="none" stroke="url(#pulse)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="33" cy="67" r="3.5" fill="#22d3ee"/>
  <circle cx="95" cy="61" r="3.5" fill="#22d3ee"/>
</svg>
